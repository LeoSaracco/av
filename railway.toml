[build]
builder = "nixpacks"

[monorepo]
root = "."

[[services]]
name = "av-frontend"
path = "."
buildCommand = "npm ci && npm run build"
startCommand = "npx serve -s dist -l $PORT"

[[services]]
name = "av-backend"
path = "backend"
  buildCommand = "./mvnw package -DskipTests --batch-mode"
  startCommand = "java -jar target/av-fitness-api-0.1.0-SNAPSHOT.jar"
  healthcheckPath = "/api/actuator/health"
