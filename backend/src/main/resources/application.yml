server:
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/av_fitness
    username: av_user
    password: av_pass_2026
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: av-fitness-jwt-secret-key-2026-must-be-256-bits-long-for-hs256
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

mercado-pago:
  access-token: ${MP_ACCESS_TOKEN:TEST-123456789}
  webhook-secret: ${MP_WEBHOOK_SECRET:test-secret}

resend:
  api-key: ${RESEND_API_KEY:re_test_123456}
  from-email: av@avfitness.app

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
