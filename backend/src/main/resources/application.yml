spring:
  application:
    name: av-fitness-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/av_fitness}
    username: ${DATABASE_USERNAME:av_user}
    password: ${DATABASE_PASSWORD:av_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.av.fitness: DEBUG

jwt:
  secret: ${JWT_SECRET:placeholder-secret-change-in-production}
  expiration-ms: 3600000
  refresh-expiration-ms: 604800000

mercadopago:
  access-token: ${MERCADOPAGO_ACCESS_TOKEN:test}

resend:
  api-key: ${RESEND_API_KEY:test}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
