# ── AV Fitness API — Base config ──────────────────────────────────────────────
server:
  port: 8080
  servlet:
    context-path: /api

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: av-fitness-api

jwt:
  secret: ${JWT_SECRET:dev-secret-change-me-in-production-at-least-256-bits}
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

mercado-pago:
  access-token: ${MP_ACCESS_TOKEN:TEST-00000000}
  webhook-secret: ${MP_WEBHOOK_SECRET:test}

resend:
  api-key: ${RESEND_API_KEY:re_test_00000000}
  from-email: ${RESEND_FROM:av@avfitness.app}

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
