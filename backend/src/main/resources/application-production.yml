# ── AV Fitness API — Railway production ───────────────────────────────────────
spring:
  datasource:
    url: ${DATABASE_URL}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

cors:
  allowed-origins: ${CORS_ORIGINS:https://av-fitness.railway.app}
