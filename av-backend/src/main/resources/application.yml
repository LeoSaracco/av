server:
  port: ${PORT:8080}

spring:
  application:
    name: av-backend
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

logging:
  structured:
    format:
      console: logstash
  level:
    root: INFO
    com.av.fitness: DEBUG
    org.springframework.security: DEBUG

auth:
  cookie-secure: ${AUTH_COOKIE_SECURE:false}

jwt:
  access-token-expiration: 900000
  refresh-token-expiration: 604800000
  issuer: av-fitness

cors:
  allowed-origins: http://localhost:5173

resend:
  api-key: ${RESEND_API_KEY:}
  from-email: ${RESEND_FROM_EMAIL:onboarding@resend.dev}
