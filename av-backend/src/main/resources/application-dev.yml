spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/avdb
    username: avuser
    password: avpass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    show-sql: true
    properties:
      hibernate:
        ddl-auto: validate

jwt:
  secret: dev-secret-key-change-in-production-minimum-256-bits-long-for-hs256-algorithm

cors:
  allowed-origins: http://localhost:5173

logging:
  level:
    com.av.fitness: DEBUG
    org.flywaydb: DEBUG
