services:
  av-postgres:
    image: postgres:16-alpine
    container_name: av-postgres
    environment:
      POSTGRES_DB: avdb
      POSTGRES_USER: avuser
      POSTGRES_PASSWORD: avpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avuser -d avdb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - av-net

  av-backend:
    build:
      context: ./av-backend
      dockerfile: Dockerfile
    container_name: av-backend
    depends_on:
      av-postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://av-postgres:5432/avdb
      SPRING_DATASOURCE_USERNAME: avuser
      SPRING_DATASOURCE_PASSWORD: avpass
      JWT_SECRET: docker-dev-jwt-secret-at-least-256-bits-long-for-hs256
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - av-net

  av-frontend:
    image: node:22-alpine
    container_name: av-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./av-frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8080
    networks:
      - av-net

volumes:
  pgdata:

networks:
  av-net:
    driver: bridge
