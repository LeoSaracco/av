# ── Docker Compose — AV Fitness App ──────────────────────────────────────────
# Desarrollo local completo: PostgreSQL 16 + Backend + Frontend
# Levantar todo:  docker compose up -d
# Solo DB:        docker compose up -d postgres
# Bajar:          docker compose down -v

services:
  postgres:
    image: postgres:16-alpine
    container_name: av-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: av_fitness
      POSTGRES_USER: av_user
      POSTGRES_PASSWORD: av_pass_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U av_user -d av_fitness"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: av-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/av_fitness
      SPRING_DATASOURCE_USERNAME: av_user
      SPRING_DATASOURCE_PASSWORD: av_pass_2026
      JWT_SECRET: dev-secret-change-in-production
      MP_ACCESS_TOKEN: TEST-123456789
      MP_WEBHOOK_SECRET: test-secret
      RESEND_API_KEY: re_test_123456
    depends_on:
      postgres:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: av-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@av.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  pgdata:
