name: Tenable Vulnerability Scan

on:
  workflow_dispatch:
    inputs:
      scan_id:
        description: Optional Tenable scan ID override. Uses TENABLE_SCAN_ID secret when empty.
        required: false
        type: string
      launch_scan:
        description: Launch the Tenable scan before exporting results.
        required: true
        default: true
        type: boolean
      wait_for_completion:
        description: Wait until the scan completes before exporting results.
        required: true
        default: true
        type: boolean
      alt_targets:
        description: Optional comma-separated target override for the scan launch.
        required: false
        type: string
      fail_on_severities:
        description: Comma-separated severities that fail the workflow.
        required: true
        default: critical,high
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tenable-scan:
    name: Run Tenable scan gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TENABLE_ACCESS_KEY: ${{ secrets.TENABLE_ACCESS_KEY }}
      TENABLE_SECRET_KEY: ${{ secrets.TENABLE_SECRET_KEY }}
      TENABLE_SCAN_ID: ${{ inputs.scan_id || secrets.TENABLE_SCAN_ID }}
      TENABLE_LAUNCH_SCAN: ${{ inputs.launch_scan }}
      TENABLE_WAIT_FOR_COMPLETION: ${{ inputs.wait_for_completion }}
      TENABLE_ALT_TARGETS: ${{ inputs.alt_targets }}
      TENABLE_FAIL_ON_SEVERITIES: ${{ inputs.fail_on_severities }}
      TENABLE_SCAN_TIMEOUT_SECONDS: "5400"
      TENABLE_EXPORT_TIMEOUT_SECONDS: "600"
      TENABLE_POLL_SECONDS: "30"
      TENABLE_RESULTS_DIR: tenable-results
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Mask Tenable secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${TENABLE_ACCESS_KEY}" ]; then
            echo "::add-mask::${TENABLE_ACCESS_KEY}"
          fi
          if [ -n "${TENABLE_SECRET_KEY}" ]; then
            echo "::add-mask::${TENABLE_SECRET_KEY}"
          fi

      - name: Run Tenable scan gate
        shell: bash
        run: python3 .github/scripts/tenable_scan_gate.py

      - name: Upload Tenable results
        if: always()
        uses: actions/upload-artifact@5d5d22a31266ced268874388b861e4b58bb5c2f3 # v4.3.1
        with:
          name: tenable-results-${{ github.run_id }}
          path: tenable-results/
          if-no-files-found: warn
          retention-days: 14
