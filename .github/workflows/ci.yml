name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: av-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: av-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Audit high vulnerabilities
        run: npm audit --audit-level=high

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: av-backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: avdb
          POSTGRES_USER: avuser
          POSTGRES_PASSWORD: avpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U avuser -d avdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/avdb
      SPRING_DATASOURCE_USERNAME: avuser
      SPRING_DATASOURCE_PASSWORD: avpass
      JWT_SECRET: ci-secret-must-be-at-least-32-characters
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Java
        uses: actions/setup-java@387ac29b308b003ca37ba93a6cab5eb57c8f5f93 # v4.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Ensure Maven Wrapper is executable
        run: chmod +x ./mvnw
      - name: Test
        run: ./mvnw --batch-mode test
      - name: Package
        run: ./mvnw --batch-mode package -DskipTests

