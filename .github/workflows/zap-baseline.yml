name: OWASP ZAP Baseline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  zap-baseline:
    name: ZAP baseline - ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            target: https://av-frontend-production.up.railway.app
            artifact: zap-frontend
            rules: .zap/frontend-rules.tsv
          - name: backend
            target: https://av-backend-production.up.railway.app
            artifact: zap-backend
            rules: .zap/backend-rules.tsv
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Run ZAP baseline scan
        uses: zaproxy/action-baseline@6c5a007541891231cd9e0ddec25d4f25c59c9874 # v0.15.0
        with:
          target: ${{ matrix.target }}
          rules_file_name: ${{ matrix.rules }}
          allow_issue_writing: false
          fail_action: true
          artifact_name: ${{ matrix.artifact }}
          cmd_options: "-a -m 3"

      - name: Write scan summary
        if: always()
        env:
          TARGET_NAME: ${{ matrix.name }}
          TARGET_URL: ${{ matrix.target }}
          ARTIFACT_NAME: ${{ matrix.artifact }}
        run: |
          {
            echo "## OWASP ZAP Baseline"
            echo ""
            echo "- Target: ${TARGET_NAME}"
            echo "- URL: ${TARGET_URL}"
            echo "- Artifact: ${ARTIFACT_NAME}"
            echo "- Mode: passive baseline scan"
            echo "- Quality gate: fail on any ZAP alert"
          } >> "$GITHUB_STEP_SUMMARY"
